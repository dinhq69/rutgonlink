<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rutgon.dinhq.io.vn — dinhq</title>
  
  <link rel="icon" type="image/png" sizes="32x32" href="logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.3s, color 0.3s; }
    .glow-effect-dark { box-shadow: 0 0 50px -10px rgba(99, 102, 241, 0.15); }
    .glow-effect-light { box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4 sm:p-8 relative bg-slate-50 dark:bg-[#0b0f19] text-slate-800 dark:text-fuchsia-50">

  <!-- Header -->
  <header class="w-full max-w-3xl flex justify-between items-center py-4 z-20">
    <div class="flex items-center gap-3">
      <img src="logo.png" alt="Logo" class="w-9 h-9 object-contain rounded-full shadow" />
      <div>
        <span class="font-bold text-base sm:text-lg tracking-tight text-slate-900 dark:text-white block leading-tight">rutgon.dinhq.io.vn</span>
        <span class="text-[11px] text-slate-500 dark:text-slate-400 font-medium">Developed by dinhq</span>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <button id="themeToggle" onclick="toggleTheme()" class="p-2 rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-700 transition-all">
        <svg id="sunIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        <svg id="moonIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
      </button>
      <span class="text-xs px-2.5 py-1 rounded-full bg-slate-200 dark:bg-slate-800/80 text-slate-600 dark:text-slate-400 border border-slate-300 dark:border-slate-700/50 hidden sm:inline-block">Gemini</span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="w-full max-w-3xl my-auto z-20">
    <div id="mainCard" class="bg-white dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 sm:p-8 backdrop-blur-xl transition-all glow-effect-light dark:glow-effect-dark">
      
      <!-- Logo Main -->
      <div class="text-center mb-6">
        <div class="inline-block p-3 bg-slate-100 dark:bg-slate-950/60 rounded-2xl border border-slate-200 dark:border-slate-800/80 mb-3">
          <img src="logo.png" alt="Logo dinhq" class="w-14 h-14 object-contain rounded-full" />
        </div>
        <h1 class="text-2xl font-bold text-slate-900 dark:text-white tracking-tight mb-1">Rút gọn link & Tạo mã QR</h1>
        <p class="text-slate-500 dark:text-slate-400 text-xs">Tạo nhanh liên kết ngắn, ghi chú bảo mật và mã QR tùy chỉnh</p>
      </div>

      <!-- Tab Chuyển Đổi -->
      <div class="grid grid-cols-3 gap-1.5 p-1 bg-slate-100 dark:bg-slate-950 rounded-xl mb-6 border border-slate-200 dark:border-slate-800/80 text-center">
        <button id="tabLink" onclick="switchTab('link')" class="py-2.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition-all">Rút gọn Link 🔗</button>
        <button id="tabText" onclick="switchTab('text')" class="py-2.5 text-xs font-semibold rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all">Tạo ghi chú 🔒</button>
        <button id="tabQr" onclick="switchTab('qr')" class="py-2.5 text-xs font-semibold rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all">Tạo mã QR 📱</button>
      </div>

      <!-- Form 1: Rút Gọn Link -->
      <form id="linkForm" class="space-y-4">
        <div>
          <label for="urlInput" class="block text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Đường dẫn gốc</label>
          <input type="url" id="urlInput" placeholder="https://example.com/duong-dan-rat-dai..." required class="w-full px-4 py-3.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-600 focus:outline-none focus:border-indigo-500 text-sm">
        </div>
        <div>
          <label for="linkCustom" class="block text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Tùy chỉnh đuôi link (Không bắt buộc)</label>
          <div class="flex items-center bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3 focus-within:border-indigo-500">
            <span class="text-xs text-slate-400 dark:text-slate-500 select-none">nk.dinhq.io.vn/</span>
            <input type="text" id="linkCustom" placeholder="Để trống sẽ tự động tạo" class="w-full py-3.5 bg-transparent text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-600 focus:outline-none text-sm pl-1">
          </div>
        </div>
        <button type="submit" id="submitLinkBtn" class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold rounded-xl transition-all text-sm shadow-lg shadow-indigo-600/20">Tạo Link Rút Gọn</button>
      </form>

      <!-- Form 2: Plaintext -->
      <form id="textForm" class="space-y-4 hidden">
        <div>
          <label for="textContent" class="block text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Nội dung ghi chú</label>
          <textarea id="textContent" rows="4" placeholder="Nhập văn bản cần lưu trữ..." required class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-600 focus:outline-none focus:border-emerald-500 text-sm font-mono"></textarea>
        </div>
        <div>
          <label for="textPassword" class="block text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Mật khẩu khóa (Không bắt buộc)</label>
          <input type="password" id="textPassword" placeholder="Để trống nếu không muốn đặt mật khẩu..." class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-600 focus:outline-none focus:border-emerald-500 text-sm">
        </div>
        <div>
          <label for="textCustom" class="block text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Tùy chỉnh đuôi link (Không bắt buộc)</label>
          <div class="flex items-center bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3 focus-within:border-emerald-500">
            <span class="text-xs text-slate-400 dark:text-slate-500 select-none">file.dinhq.io.vn/</span>
            <input type="text" id="textCustom" placeholder="Để trống sẽ tự động tạo" class="w-full py-3.5 bg-transparent text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-600 focus:outline-none text-sm pl-1">
          </div>
        </div>
        <button type="submit" id="submitTextBtn" class="w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-semibold rounded-xl transition-all text-sm shadow-lg shadow-emerald-600/20">Lưu Ghi Chú</button>
      </form>

      <!-- Form 3: QR Grid -->
      <div id="qrForm" class="space-y-4 hidden">
        <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">Chọn nội dung tạo QR</label>
        
        <!-- Grid Danh Mục -->
        <div class="flex flex-wrap gap-2 max-h-56 overflow-y-auto p-1 scrollbar-thin">
          <button type="button" onclick="setCategory('url', 'Đường dẫn URL', 'https://...')" class="cat-btn bg-amber-500 text-white font-semibold px-3 py-2 rounded-xl text-xs flex items-center gap-1.5 shadow transition-all">🔗 Liên kết / URL</button>
          <button type="button" onclick="setCategory('url', 'Facebook', 'https://facebook.com/username')" class="cat-btn bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-3 py-2 rounded-xl text-xs flex items-center gap-1.5 hover:bg-amber-500 hover:text-white transition-all">📘 Facebook</button>
          <button type="button" onclick="setCategory('url', 'TikTok', 'https://tiktok.com/@username')" class="cat-btn bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-3 py-2 rounded-xl text-xs flex items-center gap-1.5 hover:bg-amber-500 hover:text-white transition-all">🎵 TikTok</button>
          <button type="button" onclick="setCategory('url', 'YouTube', 'https://youtube.com/c/channel')" class="cat-btn bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-3 py-2 rounded-xl text-xs flex items-center gap-1.5 hover:bg-amber-500 hover:text-white transition-all">▶️ YouTube</button>
          <button type="button" onclick="setCategory('wifi', 'Wi-Fi', '')" class="cat-btn bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-3 py-2 rounded-xl text-xs flex items-center gap-1.5 hover:bg-amber-500 hover:text-white transition-all">📶 Wi-Fi</button>
          <button type="button" onclick="setCategory('text', 'Văn bản', 'Nhập nội dung...')" class="cat-btn bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-3 py-2 rounded-xl text-xs flex items-center gap-1.5 hover:bg-amber-500 hover:text-white transition-all">📝 Văn bản</button>
          <button type="button" onclick="setCategory('url', 'Google Maps', 'https://maps.google.com/?q=...')" class="cat-btn bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-3 py-2 rounded-xl text-xs flex items-center gap-1.5 hover:bg-amber-500 hover:text-white transition-all">📍 Google Maps</button>
          <button type="button" onclick="setCategory('url', 'Telegram', 'https://t.me/username')" class="cat-btn bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-3 py-2 rounded-xl text-xs flex items-center gap-1.5 hover:bg-amber-500 hover:text-white transition-all">✈️ Telegram</button>
          <button type="button" onclick="setCategory('url', 'Instagram', 'https://instagram.com/username')" class="cat-btn bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-3 py-2 rounded-xl text-xs flex items-center gap-1.5 hover:bg-amber-500 hover:text-white transition-all">📸 Instagram</button>
          <button type="button" onclick="setCategory('file', 'Tệp tài liệu', '')" class="cat-btn bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-3 py-2 rounded-xl text-xs flex items-center gap-1.5 hover:bg-amber-500 hover:text-white transition-all">📄 File / PDF</button>
          <button type="button" onclick="setCategory('url', 'Thanh toán', 'https://paypal.me/username')" class="cat-btn bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-3 py-2 rounded-xl text-xs flex items-center gap-1.5 hover:bg-amber-500 hover:text-white transition-all">💳 Thanh toán</button>
          <button type="button" onclick="setCategory('url', 'Spotify', 'https://open.spotify.com/track/...')" class="cat-btn bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-3 py-2 rounded-xl text-xs flex items-center gap-1.5 hover:bg-amber-500 hover:text-white transition-all">🎧 Spotify</button>
        </div>

        <!-- Dynamic Form Body -->
        <form id="qrInnerForm" class="space-y-4 pt-2">
          <!-- Nhập URL -->
          <div id="qrInputUrlGroup" class="space-y-3">
            <div>
              <label id="qrUrlLabel" for="qrUrlInput" class="block text-xs font-semibold text-amber-500 uppercase tracking-wider mb-1">Đường dẫn URL</label>
              <input type="url" id="qrUrlInput" placeholder="https://example.com/..." class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-600 focus:outline-none focus:border-amber-500 text-sm">
            </div>
            <div>
              <label for="qrCustom" class="block text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Tùy chỉnh đuôi link QR (Không bắt buộc)</label>
              <div class="flex items-center bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3 focus-within:border-amber-500">
                <span class="text-xs text-slate-400 dark:text-slate-500 select-none">qr.dinhq.io.vn/</span>
                <input type="text" id="qrCustom" placeholder="Để trống sẽ tự động tạo" class="w-full py-3 bg-transparent text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-600 focus:outline-none text-sm pl-1">
              </div>
            </div>
          </div>

          <!-- Nhập File/PDF Upload trực tiếp -->
          <div id="qrInputFileGroup" class="space-y-3 hidden">
            <div>
              <label class="block text-xs font-semibold text-amber-500 uppercase tracking-wider mb-1">Tải tệp lên (PDF, Doc, Ảnh...)</label>
              <input type="file" id="qrFileInput" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-slate-900 dark:text-white text-sm file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-500 file:text-white hover:file:bg-amber-600 cursor-pointer">
            </div>
            <div>
              <label for="qrFileCustom" class="block text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Tùy chỉnh đuôi link (Không bắt buộc)</label>
              <div class="flex items-center bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3 focus-within:border-amber-500">
                <span class="text-xs text-slate-400 dark:text-slate-500 select-none">qr.dinhq.io.vn/</span>
                <input type="text" id="qrFileCustom" maxlength="4" placeholder="VD: a1b2 (tối đa 4 ký tự)" class="w-full py-3 bg-transparent text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-600 focus:outline-none text-sm pl-1">
              </div>
            </div>
          </div>

          <!-- Nhập Wifi -->
          <div id="qrInputWifiGroup" class="space-y-3 hidden">
            <div>
              <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Tên Wi-Fi (SSID)</label>
              <input type="text" id="wifiSsid" placeholder="Nhập tên mạng Wi-Fi..." class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-slate-900 dark:text-white text-sm">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Mật khẩu Wi-Fi</label>
              <input type="text" id="wifiPass" placeholder="Nhập mật khẩu..." class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-slate-900 dark:text-white text-sm">
            </div>
          </div>

          <!-- Nhập Text -->
          <div id="qrInputTextGroup" class="space-y-3 hidden">
            <div>
              <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Nội dung văn bản</label>
              <textarea id="plainQrText" rows="3" placeholder="Nhập văn bản cần tạo mã..." class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-slate-900 dark:text-white text-sm"></textarea>
            </div>
          </div>

          <!-- Chọn màu QR -->
          <div class="pt-2 border-t border-slate-200 dark:border-slate-800 flex items-center gap-6">
            <span class="text-xs font-medium text-slate-500 uppercase tracking-wider">Màu mã QR:</span>
            <div class="flex items-center gap-2">
              <span class="text-xs text-slate-600 dark:text-slate-400">Màu mã:</span>
              <input type="color" id="qrColorDark" value="#000000" class="w-7 h-7 rounded border-0 cursor-pointer bg-transparent">
            </div>
            <div class="flex items-center gap-2">
              <span class="text-xs text-slate-600 dark:text-slate-400">Màu nền:</span>
              <input type="color" id="qrColorLight" value="#ffffff" class="w-7 h-7 rounded border-0 cursor-pointer bg-transparent">
            </div>
          </div>

          <button type="submit" id="submitQrBtn" class="w-full py-3.5 px-4 bg-amber-600 hover:bg-amber-500 active:bg-amber-700 text-white font-semibold rounded-xl transition-all text-sm shadow-lg shadow-amber-600/20">Tạo Mã QR</button>
        </form>
      </div>

      <!-- Kết quả -->
      <div id="resultBox" class="hidden mt-6 pt-6 border-t border-slate-200 dark:border-slate-800/80">
        <div id="linkResultContainer">
          <label id="resultLabel" class="block text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Đường dẫn kết quả</label>
          <div class="flex items-center gap-2 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 p-2 rounded-xl mb-3">
            <input type="text" id="resultInput" readonly class="w-full bg-transparent px-3 font-medium text-sm focus:outline-none">
            <button id="copyBtn" onclick="copyResult()" class="px-4 py-2 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-medium rounded-lg transition-all shrink-0">Sao chép</button>
          </div>
        </div>

        <div id="qrCodeDisplayContainer" class="hidden flex flex-col items-center justify-center p-5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl mt-3">
          <p class="text-xs text-slate-500 dark:text-slate-400 mb-3 font-medium">Mã QR của bạn:</p>
          <div class="p-3 bg-white rounded-xl shadow-lg mb-4">
            <img id="generatedQrImage" src="" alt="Mã QR" class="w-48 h-48 object-contain" />
          </div>
          <a id="downloadQrBtn" href="" download="qr-code.png" target="_blank" class="px-5 py-2.5 bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold rounded-lg transition-all shadow-md">Tải về mã QR</a>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full max-w-2xl text-center py-4 text-xs text-slate-500 dark:text-slate-600 flex items-center justify-center gap-2 z-20">
    <img src="logo.png" alt="Icon dinhq" class="w-4 h-4 object-contain opacity-60 rounded-full" />
    <span>&copy; 2026 rutgon.dinhq.io.vn — dinhq</span>
  </footer>

  <!-- Script Theme & Logic -->
  <script>
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');

    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
      sunIcon.classList.remove('hidden');
    } else {
      document.documentElement.classList.remove('dark');
      moonIcon.classList.remove('hidden');
    }

    function toggleTheme() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        moonIcon.classList.add('hidden');
        sunIcon.classList.remove('hidden');
      }
    }

    let currentQrCategory = 'url';

    function switchTab(type) {
      document.getElementById('resultBox').classList.add('hidden');
      const inactiveStyle = 'py-2.5 text-xs font-semibold rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all';
      
      ['tabLink', 'tabText', 'tabQr'].forEach(id => document.getElementById(id).className = inactiveStyle);
      ['linkForm', 'textForm', 'qrForm'].forEach(id => document.getElementById(id).classList.add('hidden'));

      if (type === 'link') {
        document.getElementById('linkForm').classList.remove('hidden');
        document.getElementById('tabLink').className = 'py-2.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition-all';
      } else if (type === 'text') {
        document.getElementById('textForm').classList.remove('hidden');
        document.getElementById('tabText').className = 'py-2.5 text-xs font-semibold rounded-lg bg-emerald-600 text-white transition-all';
      } else if (type === 'qr') {
        document.getElementById('qrForm').classList.remove('hidden');
        document.getElementById('tabQr').className = 'py-2.5 text-xs font-semibold rounded-lg bg-amber-600 text-white transition-all';
      }
    }

    function setCategory(type, label, placeholder) {
      currentQrCategory = type;
      
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.innerText.includes(label)) {
          btn.className = 'cat-btn bg-amber-500 text-white font-semibold px-3 py-2 rounded-xl text-xs flex items-center gap-1.5 shadow transition-all';
        } else {
          btn.className = 'cat-btn bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-3 py-2 rounded-xl text-xs flex items-center gap-1.5 hover:bg-amber-500 hover:text-white transition-all';
        }
      });

      document.getElementById('qrInputUrlGroup').classList.toggle('hidden', type !== 'url');
      document.getElementById('qrInputFileGroup').classList.toggle('hidden', type !== 'file');
      document.getElementById('qrInputWifiGroup').classList.toggle('hidden', type !== 'wifi');
      document.getElementById('qrInputTextGroup').classList.toggle('hidden', type !== 'text');

      if (type === 'url') {
        document.getElementById('qrUrlLabel').innerText = `Nhập URL (${label})`;
        document.getElementById('qrUrlInput').placeholder = placeholder;
      }
    }

    // Handlers
    document.getElementById('linkForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitLinkBtn');
      btn.disabled = true; btn.innerText = 'Đang xử lý...';
      document.getElementById('qrCodeDisplayContainer').classList.add('hidden');
      document.getElementById('linkResultContainer').classList.remove('hidden');

      try {
        const res = await fetch('/api/shorten', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ 
            url: document.getElementById('urlInput').value,
            customSlug: document.getElementById('linkCustom').value
          })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('resultLabel').innerText = 'Link rút gọn của bạn:';
          document.getElementById('resultInput').className = 'w-full bg-transparent px-3 text-indigo-600 dark:text-indigo-400 font-medium text-sm focus:outline-none';
          document.getElementById('resultInput').value = data.shortUrl;
          document.getElementById('resultBox').classList.remove('hidden');
        } else { alert(data.error); }
      } catch (err) { alert('Không thể kết nối máy chủ!'); }
      finally { btn.disabled = false; btn.innerText = 'Tạo Link Rút Gọn'; }
    });

    document.getElementById('textForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitTextBtn');
      btn.disabled = true; btn.innerText = 'Đang xử lý...';
      document.getElementById('qrCodeDisplayContainer').classList.add('hidden');
      document.getElementById('linkResultContainer').classList.remove('hidden');

      try {
        const res = await fetch('/api/paste', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            content: document.getElementById('textContent').value,
            password: document.getElementById('textPassword').value,
            customSlug: document.getElementById('textCustom').value
          })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('resultLabel').innerText = 'Link ghi chú của bạn:';
          document.getElementById('resultInput').className = 'w-full bg-transparent px-3 text-emerald-600 dark:text-emerald-400 font-medium text-sm focus:outline-none';
          document.getElementById('resultInput').value = data.pasteUrl;
          document.getElementById('resultBox').classList.remove('hidden');
        } else { alert(data.error); }
      } catch (err) { alert('Không thể kết nối máy chủ!'); }
      finally { btn.disabled = false; btn.innerText = 'Lưu Ghi Chú'; }
    });

    document.getElementById('qrInnerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitQrBtn');
      btn.disabled = true; btn.innerText = 'Đang xử lý...';

      let qrPayloadContent = '';
      const colorDark = document.getElementById('qrColorDark').value.replace('#', '');
      const colorLight = document.getElementById('qrColorLight').value.replace('#', '');

      if (currentQrCategory === 'url') {
        const targetUrl = document.getElementById('qrUrlInput').value.trim();
        const customSlug = document.getElementById('qrCustom').value.trim();
        try {
          const res = await fetch('/api/qr-link', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ url: targetUrl, customSlug })
          });
          const data = await res.json();
          if (data.success) {
            qrPayloadContent = data.qrUrl;
            document.getElementById('resultLabel').innerText = 'Link mã QR của bạn:';
            document.getElementById('resultInput').className = 'w-full bg-transparent px-3 text-amber-600 dark:text-amber-400 font-medium text-sm focus:outline-none';
            document.getElementById('resultInput').value = data.qrUrl;
            document.getElementById('linkResultContainer').classList.remove('hidden');
          } else { alert(data.error); btn.disabled = false; btn.innerText = 'Tạo Mã QR'; return; }
        } catch (err) { alert('Không thể kết nối máy chủ!'); btn.disabled = false; btn.innerText = 'Tạo Mã QR'; return; }
      } else if (currentQrCategory === 'file') {
        const fileInput = document.getElementById('qrFileInput');
        if (!fileInput.files || fileInput.files.length === 0) {
          alert('Vui lòng chọn một tệp để tải lên!');
          btn.disabled = false; btn.innerText = 'Tạo Mã QR';
          return;
        }

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        formData.append('customSlug', document.getElementById('qrFileCustom').value.trim());

        try {
          const res = await fetch('/api/upload', {
            method: 'POST',
            body: formData
          });
          const data = await res.json();
          if (data.success) {
            qrPayloadContent = data.shortUrl; // Link định dạng 4 chữ từ backend
            document.getElementById('resultLabel').innerText = 'Link tệp ngắn gọn của bạn:';
            document.getElementById('resultInput').className = 'w-full bg-transparent px-3 text-amber-600 dark:text-amber-400 font-medium text-sm focus:outline-none';
            document.getElementById('resultInput').value = data.shortUrl;
            document.getElementById('linkResultContainer').classList.remove('hidden');
          } else { alert(data.error); btn.disabled = false; btn.innerText = 'Tạo Mã QR'; return; }
        } catch (err) { alert('Không thể tải tệp lên máy chủ!'); btn.disabled = false; btn.innerText = 'Tạo Mã QR'; return; }
      } else if (currentQrCategory === 'wifi') {
        const ssid = document.getElementById('wifiSsid').value.trim();
        const pass = document.getElementById('wifiPass').value.trim();
        qrPayloadContent = `WIFI:T:WPA;S:${ssid};P:${pass};;`;
        document.getElementById('linkResultContainer').classList.add('hidden');
      } else if (currentQrCategory === 'text') {
        qrPayloadContent = document.getElementById('plainQrText').value.trim();
        document.getElementById('linkResultContainer').classList.add('hidden');
      }

      if (qrPayloadContent) {
        const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&color=${colorDark}&bgcolor=${colorLight}&data=${encodeURIComponent(qrPayloadContent)}`;
        document.getElementById('generatedQrImage').src = qrApiUrl;
        document.getElementById('downloadQrBtn').href = qrApiUrl;
        document.getElementById('qrCodeDisplayContainer').classList.remove('hidden');
        document.getElementById('resultBox').classList.remove('hidden');
      }
      btn.disabled = false; btn.innerText = 'Tạo Mã QR';
    });

    function copyResult() {
      const input = document.getElementById('resultInput');
      input.select();
      navigator.clipboard.writeText(input.value);
      const copyBtn = document.getElementById('copyBtn');
      copyBtn.innerText = 'Đã chép!';
      copyBtn.classList.add('bg-emerald-600', 'text-white');
      setTimeout(() => {
        copyBtn.innerText = 'Sao chép';
        copyBtn.classList.remove('bg-emerald-600', 'text-white');
      }, 2000);
    }
  </script>

  <!-- Anti-DevTools Script -->
  <script>
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('keydown', (e) => {
      if (e.key === 'F12') { e.preventDefault(); return false; }
      if (e.ctrlKey && e.shiftKey && ['I','i','J','j','C','c'].includes(e.key)) { e.preventDefault(); return false; }
      if (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S')) { e.preventDefault(); return false; }
    });
    setInterval(() => {
      const start = performance.now();
      debugger;
      if (performance.now() - start > 100) {
        document.body.innerHTML = '<h1 style="text-align:center;margin-top:20%;">Hành vi soi code bị cấm!</h1>';
      }
    }, 1000);
  </script>
</body>
</html>
