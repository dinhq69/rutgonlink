<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rutgon.dinhq.io.vn — Dinh Q.</title>
  
  <link rel="icon" type="image/png" sizes="32x32" href="logo.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="logo.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="logo.png" />
  <link rel="shortcut icon" href="logo.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.3s, color 0.3s; }
    .glow-effect-dark { box-shadow: 0 0 50px -10px rgba(99, 102, 241, 0.15); }
    .glow-effect-light { box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4 sm:p-8 relative bg-slate-50 dark:bg-[#0b0f19] text-slate-800 dark:text-fuchsia-50">

  <!-- Header -->
  <header class="w-full max-w-2xl flex justify-between items-center py-4 z-20">
    <div class="flex items-center gap-3">
      <img src="logo.png" alt="Logo" class="w-9 h-9 object-contain rounded-full shadow" />
      <div>
        <span class="font-bold text-base sm:text-lg tracking-tight text-slate-900 dark:text-white block leading-tight">rutgon.dinhq.io.vn</span>
        <span class="text-[11px] text-slate-500 dark:text-slate-400 font-medium">Developed by Dinh Q.</span>
      </div>
    </div>

    <!-- Toggle Theme & Badge -->
    <div class="flex items-center gap-3">
      <button id="themeToggle" onclick="toggleTheme()" class="p-2 rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-700 transition-all">
        <!-- Sun Icon -->
        <svg id="sunIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        <!-- Moon Icon -->
        <svg id="moonIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
      </button>
      <span class="text-xs px-2.5 py-1 rounded-full bg-slate-200 dark:bg-slate-800/80 text-slate-600 dark:text-slate-400 border border-slate-300 dark:border-slate-700/50 hidden sm:inline-block">Gemini</span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="w-full max-w-xl my-auto z-20">
    <div id="mainCard" class="bg-white dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 sm:p-8 backdrop-blur-xl transition-all glow-effect-light dark:glow-effect-dark">
      
      <!-- Logo Main -->
      <div class="text-center mb-6">
        <div class="inline-block p-3 bg-slate-100 dark:bg-slate-950/60 rounded-2xl border border-slate-200 dark:border-slate-800/80 mb-3">
          <img src="logo.png" alt="Logo Dinh Q" class="w-14 h-14 object-contain rounded-full" />
        </div>
        <h1 class="text-2xl font-bold text-slate-900 dark:text-white tracking-tight mb-1">Công cụ Đa năng</h1>
        <p class="text-slate-500 dark:text-slate-400 text-xs">Rút gọn link, lưu trữ văn bản & tạo mã QR</p>
      </div>

      <!-- Tab Chuyển Đổi -->
      <div class="grid grid-cols-3 gap-1.5 p-1 bg-slate-100 dark:bg-slate-950 rounded-xl mb-6 border border-slate-200 dark:border-slate-800/80 text-center">
        <button id="tabLink" onclick="switchTab('link')" class="py-2.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition-all">Link (nk)</button>
        <button id="tabText" onclick="switchTab('text')" class="py-2.5 text-xs font-semibold rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all">Plaintext (file) 🔒</button>
        <button id="tabQr" onclick="switchTab('qr')" class="py-2.5 text-xs font-semibold rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all">Tạo QR Code 📱</button>
      </div>

      <!-- Form 1: Rút Gọn Link -->
      <form id="linkForm" class="space-y-4">
        <div>
          <label for="urlInput" class="block text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Đường dẫn gốc</label>
          <input 
            type="url" 
            id="urlInput" 
            placeholder="https://example.com/duong-dan-rat-dai..." 
            required
            class="w-full px-4 py-3.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-600 focus:outline-none focus:border-indigo-500 text-sm"
          >
        </div>

        <div>
          <label for="linkCustom" class="block text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Tùy chỉnh link (Không bắt buộc)</label>
          <div class="flex items-center bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3 focus-within:border-indigo-500">
            <span class="text-xs text-slate-400 dark:text-slate-500 select-none">nk.dinhq.io.vn/</span>
            <input 
              type="text" 
              id="linkCustom" 
              placeholder="Để trống sẽ tạo 4 ký tự" 
              class="w-full py-3.5 bg-transparent text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-600 focus:outline-none text-sm pl-1"
            >
          </div>
        </div>

        <button type="submit" id="submitLinkBtn" class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold rounded-xl transition-all text-sm shadow-lg shadow-indigo-600/20">
          <span>Tạo Link Rút Gọn</span>
        </button>
      </form>

      <!-- Form 2: Plaintext -->
      <form id="textForm" class="space-y-4 hidden">
        <div>
          <label for="textContent" class="block text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Nội dung văn bản</label>
          <textarea 
            id="textContent" 
            rows="5" 
            placeholder="Nhập nội dung cần lưu trữ bảo mật..." 
            required 
            class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-600 focus:outline-none focus:border-emerald-500 text-sm font-mono"
          ></textarea>
        </div>
        <div>
          <label for="textPassword" class="block text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Mật khẩu bảo vệ</label>
          <input 
            type="password" 
            id="textPassword" 
            placeholder="Nhập mật khẩu khóa ghi chú..." 
            required 
            class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-600 focus:outline-none focus:border-emerald-500 text-sm"
          >
        </div>

        <div>
          <label for="textCustom" class="block text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Tùy chỉnh link (Không bắt buộc)</label>
          <div class="flex items-center bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3 focus-within:border-emerald-500">
            <span class="text-xs text-slate-400 dark:text-slate-500 select-none">file.dinhq.io.vn/</span>
            <input 
              type="text" 
              id="textCustom" 
              placeholder="Để trống sẽ tạo 4 ký tự" 
              class="w-full py-3.5 bg-transparent text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-600 focus:outline-none text-sm pl-1"
            >
          </div>
        </div>

        <button type="submit" id="submitTextBtn" class="w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-semibold rounded-xl transition-all text-sm shadow-lg shadow-emerald-600/20">
          <span>Lưu Văn Bản Bảo Mật</span>
        </button>
      </form>

      <!-- Form 3: Tạo QR từ Link -->
      <form id="qrForm" class="space-y-4 hidden">
        <div>
          <label for="qrUrlInput" class="block text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Đường dẫn / Nội dung tạo Mã QR</label>
          <input 
            type="text" 
            id="qrUrlInput" 
            placeholder="https://example.com hoặc văn bản bất kỳ..." 
            required
            class="w-full px-4 py-3.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-600 focus:outline-none focus:border-amber-500 text-sm"
          >
        </div>

        <button type="submit" id="submitQrBtn" class="w-full py-3.5 px-4 bg-amber-600 hover:bg-amber-500 active:bg-amber-700 text-white font-semibold rounded-xl transition-all text-sm shadow-lg shadow-amber-600/20">
          <span>Tạo Mã QR ngay</span>
        </button>
      </form>

      <!-- Kết quả -->
      <div id="resultBox" class="hidden mt-6 pt-6 border-t border-slate-200 dark:border-slate-800/80">
        <div id="linkResultContainer">
          <label id="resultLabel" class="block text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Đường dẫn kết quả</label>
          <div class="flex items-center gap-2 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 p-2 rounded-xl mb-3">
            <input type="text" id="resultInput" readonly class="w-full bg-transparent px-3 font-medium text-sm focus:outline-none">
            <button id="copyBtn" onclick="copyResult()" class="px-4 py-2 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-medium rounded-lg transition-all shrink-0">Sao chép</button>
          </div>
        </div>

        <!-- Khung hiển thị Mã QR -->
        <div id="qrCodeDisplayContainer" class="hidden flex flex-col items-center justify-center p-4 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl mt-3">
          <p class="text-xs text-slate-500 dark:text-slate-400 mb-2 font-medium">Mã QR của bạn:</p>
          <img id="generatedQrImage" src="" alt="Mã QR" class="w-44 h-44 bg-white p-2 rounded-lg shadow-md mb-3" />
          <a id="downloadQrBtn" href="" download="qr-code.png" target="_blank" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold rounded-lg transition-all">Tải mã QR về máy</a>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full max-w-2xl text-center py-4 text-xs text-slate-500 dark:text-slate-600 flex items-center justify-center gap-2 z-20">
    <img src="logo.png" alt="Icon Dinh Q" class="w-4 h-4 object-contain opacity-60 rounded-full" />
    <span>&copy; 2026 rutgon.dinhq.io.vn — Dinh Q.</span>
  </footer>

  <!-- Script Theme Sáng / Tối -->
  <script>
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');

    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
      sunIcon.classList.remove('hidden');
    } else {
      document.documentElement.classList.remove('dark');
      moonIcon.classList.remove('hidden');
    }

    function toggleTheme() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        moonIcon.classList.add('hidden');
        sunIcon.classList.remove('hidden');
      }
    }
  </script>

  <!-- JS Logic -->
  <script>
    function switchTab(type) {
      const linkForm = document.getElementById('linkForm');
      const textForm = document.getElementById('textForm');
      const qrForm = document.getElementById('qrForm');
      const tabLink = document.getElementById('tabLink');
      const tabText = document.getElementById('tabText');
      const tabQr = document.getElementById('tabQr');
      const resultBox = document.getElementById('resultBox');

      resultBox.classList.add('hidden');

      const inactiveStyle = 'py-2.5 text-xs font-semibold rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all';
      tabLink.className = inactiveStyle;
      tabText.className = inactiveStyle;
      tabQr.className = inactiveStyle;

      linkForm.classList.add('hidden');
      textForm.classList.add('hidden');
      qrForm.classList.add('hidden');

      if (type === 'link') {
        linkForm.classList.remove('hidden');
        tabLink.className = 'py-2.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition-all';
      } else if (type === 'text') {
        textForm.classList.remove('hidden');
        tabText.className = 'py-2.5 text-xs font-semibold rounded-lg bg-emerald-600 text-white transition-all';
      } else if (type === 'qr') {
        qrForm.classList.remove('hidden');
        tabQr.className = 'py-2.5 text-xs font-semibold rounded-lg bg-amber-600 text-white transition-all';
      }
    }

    // Form Submit Handlers
    document.getElementById('linkForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitLinkBtn');
      btn.disabled = true; btn.innerText = 'Đang xử lý...';
      document.getElementById('qrCodeDisplayContainer').classList.add('hidden');
      document.getElementById('linkResultContainer').classList.remove('hidden');

      try {
        const res = await fetch('/api/shorten', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ 
            url: document.getElementById('urlInput').value,
            customSlug: document.getElementById('linkCustom').value
          })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('resultLabel').innerText = 'Đường dẫn ngắn (nk.dinhq.io.vn):';
          document.getElementById('resultInput').className = 'w-full bg-transparent px-3 text-indigo-600 dark:text-indigo-400 font-medium text-sm focus:outline-none';
          document.getElementById('resultInput').value = data.shortUrl;
          document.getElementById('resultBox').classList.remove('hidden');
        } else { alert(data.error); }
      } catch (err) { alert('Không thể kết nối máy chủ!'); }
      finally { btn.disabled = false; btn.innerText = 'Tạo Link Rút Gọn'; }
    });

    document.getElementById('textForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitTextBtn');
      btn.disabled = true; btn.innerText = 'Đang xử lý...';
      document.getElementById('qrCodeDisplayContainer').classList.add('hidden');
      document.getElementById('linkResultContainer').classList.remove('hidden');

      try {
        const res = await fetch('/api/paste', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            content: document.getElementById('textContent').value,
            password: document.getElementById('textPassword').value,
            customSlug: document.getElementById('textCustom').value
          })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('resultLabel').innerText = 'Đường dẫn Plaintext (file.dinhq.io.vn):';
          document.getElementById('resultInput').className = 'w-full bg-transparent px-3 text-emerald-600 dark:text-emerald-400 font-medium text-sm focus:outline-none';
          document.getElementById('resultInput').value = data.pasteUrl;
          document.getElementById('resultBox').classList.remove('hidden');
        } else { alert(data.error); }
      } catch (err) { alert('Không thể kết nối máy chủ!'); }
      finally { btn.disabled = false; btn.innerText = 'Lưu Văn Bản Bảo Mật'; }
    });

    // Form 3: Tạo QR từ URL (Client-Side API)
    document.getElementById('qrForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const inputVal = document.getElementById('qrUrlInput').value.trim();
      if (!inputVal) return;

      document.getElementById('linkResultContainer').classList.add('hidden');
      
      const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(inputVal)}`;
      document.getElementById('generatedQrImage').src = qrApiUrl;
      document.getElementById('downloadQrBtn').href = qrApiUrl;
      
      document.getElementById('qrCodeDisplayContainer').classList.remove('hidden');
      document.getElementById('resultBox').classList.remove('hidden');
    });

    function copyResult() {
      const input = document.getElementById('resultInput');
      input.select();
      navigator.clipboard.writeText(input.value);
      const copyBtn = document.getElementById('copyBtn');
      copyBtn.innerText = 'Đã chép!';
      copyBtn.classList.add('bg-emerald-600', 'text-white');
      setTimeout(() => {
        copyBtn.innerText = 'Sao chép';
        copyBtn.classList.remove('bg-emerald-600', 'text-white');
      }, 2000);
    }
  </script>

  <!-- Anti-DevTools Script -->
  <script>
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('keydown', (e) => {
      if (e.key === 'F12') { e.preventDefault(); return false; }
      if (e.ctrlKey && e.shiftKey && ['I','i','J','j','C','c'].includes(e.key)) { e.preventDefault(); return false; }
      if (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S')) { e.preventDefault(); return false; }
    });
    setInterval(() => {
      const start = performance.now();
      debugger;
      if (performance.now() - start > 100) {
        document.body.innerHTML = '<h1 style="text-align:center;margin-top:20%;">Hành vi soi code bị cấm!</h1>';
      }
    }, 1000);
  </script>
</body>
</html>
